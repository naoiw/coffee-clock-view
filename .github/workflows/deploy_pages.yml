name: Check and deploy

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

# Keep published snapshots in order, while superseding stale PR checks.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('coffee-clock-pr-{0}', github.event.pull_request.number) || 'coffee-clock-pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Validate pull request
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check

  build:
    name: Build production and preview
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: production

      - name: Checkout preview branch
        uses: actions/checkout@v4
        with:
          ref: develop
          path: preview

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Check and build production
        working-directory: production
        run: |
          pnpm install --frozen-lockfile
          pnpm run check

      - name: Check and build preview
        working-directory: preview
        run: |
          pnpm install --frozen-lockfile
          pnpm run check

      - name: Assemble production and preview
        run: |
          mkdir -p _site/dist _site/develop/dist
          cp production/index.html _site/index.html
          cp -R production/dist/. _site/dist/
          cp preview/index.html _site/develop/index.html
          cp -R preview/dist/. _site/develop/dist/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: ${{ github.ref_name == 'main' && 'github-pages' || 'github-pages-preview' }}
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
